version: 2

project_name: jitpass

before:
  hooks:
    - go mod tidy

builds:
  # Apple Silicon only, on purpose: we have no Intel hardware to test a
  # darwin/amd64 build on, and an untested binary of a security tool
  # shouldn't be published. Intel Macs still work via `go install` (source
  # builds on any Mac). CGO_ENABLED=1 is required (internal/secureenclave,
  # TECH_STACK.md §2.3), which is also why CI/releases run on macOS runners.
  - id: jit-arm64
    main: ./cmd/jit
    binary: jit
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=clang -arch arm64
    ldflags:
      - -s -w -X github.com/jitpass/jit/internal/agent.version={{.Version}}

# TODO (blocked on a real paid Developer ID Application certificate — see
# TECH_STACK.md §5 and the deferred item on task #4/#6): code signing via
# `codesign` and notarization via `xcrun notarytool` need to run here, most
# commonly as a goreleaser `before`/`after` hook or a dedicated signing step,
# gated on an APPLE_SIGNING_IDENTITY-style secret that doesn't exist yet.
# Until then, CI's snapshot job runs with `--skip=sign` deliberately.

archives:
  - id: jit-archive
    formats: [tar.gz]
    # No {{ .Version }} on purpose: stable asset names make
    # `releases/latest/download/jitpass_darwin_<arch>.tar.gz` an evergreen
    # URL, so the README's install command never goes stale. The release tag
    # and `jit --version` still carry the version.
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: jitpass
    name: jit
  # keep-existing: when a release for the tag already exists (e.g. re-running
  # the workflow to backfill assets onto a hand-written release), keep its
  # name and notes and just upload the artifacts.
  mode: keep-existing

# Homebrew tap publishing (homebrew_casks → jitpass/homebrew-tap) is
# deliberately absent until releases are signed with a Developer ID
# certificate and notarized — we don't want to promote an install path for
# unsigned binaries. When signing lands, restore the `homebrew_casks` block
# (git history has a working version: cask `jitpass`, binaries [jit],
# HOMEBREW_TAP_GITHUB_TOKEN for the push).
