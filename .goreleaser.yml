version: 2

project_name: jitpass

before:
  hooks:
    # download, NOT tidy. `go mod tidy` MUTATES go.mod/go.sum inside the
    # release build, so the artifact that gets Developer ID signed is built
    # from a module graph that differs from the reviewed, committed one — and
    # silently, since nothing reads the result. It was also redundant: ci.yml
    # already runs `go mod verify && go mod tidy` and fails the build on any
    # drift, and release.yml gates the publish on that whole pipeline.
    # `go mod download` pre-fetches the same dependencies and changes nothing.
    - go mod download

builds:
  # Apple Silicon only, on purpose: we have no Intel hardware to test a
  # darwin/amd64 build on, and an untested binary of a security tool
  # shouldn't be published. Intel Macs still work via `go install` (source
  # builds on any Mac). CGO_ENABLED=1 is required (internal/secureenclave,
  # TECH_STACK.md §2.3), which is also why CI/releases run on macOS runners.
  - id: jit-arm64
    main: ./cmd/jit
    binary: jit
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=clang -arch arm64
    ldflags:
      - -s -w -X github.com/jitpass/jit/internal/agent.version={{.Version}}

# Developer ID signing + notarization. This is the `notarize.macos`
# (cross-platform, Anchore quill) path, which is OSS — deliberately NOT
# `macos_native`, which is Pro-only and only handles .app bundles and .pkgs.
# jit ships a bare Mach-O, which is exactly what the quill path covers.
#
# Two consequences of signing a bare binary rather than a bundle, both fine
# for a CLI but worth knowing:
#   - It cannot be stapled (`xcrun stapler` needs a bundle/dmg/pkg), so
#     Gatekeeper fetches the notarization ticket online on first run.
#   - The provisioning-profile-gated entitlements stay out of reach; that's
#     the Secure Enclave wall documented in spike/secure-enclave/FINDINGS.md,
#     and notarizing the CLI does not move it.
#
# `enabled` is gated on the secret existing so that forks, PR builds and
# `--snapshot` keep working untouched. Note what that gate does NOT do: an
# unset (or empty — isEnvSet is `ok && s != ""`) value makes the notary pipe
# Skip rather than fail, so on its own it would publish an unsigned binary.
# release.yml's "Require Developer ID signing secrets" preflight is what
# forbids that, and it is the enforcement point for CLAUDE.md's never-ship-
# unsigned rule. Forks and PR builds never reach it: they run --snapshot, and
# ci.yml passes --skip=publish,sign,notarize.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [jit-arm64]
      sign:
        # Base64-encoded Developer ID Application .p12. quill requires the
        # full certificate chain to be present at signing time or Apple
        # rejects the submission with a signature-validity error, so the .p12
        # carries the G2 intermediate and Apple Root CA alongside the leaf.
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      # Notarization intentionally dropped for now. This account's notary
      # service is unreliable (1 of 9 submissions Accepted; the rest, including
      # shipped release builds, hang "In Progress" for hours), which held
      # releases hostage for days. With no `notarize:` block here, goreleaser
      # signs with the Developer ID cert above and skips notarization entirely
      # -- a fast, Apple-queue-free release. Distribution leads with the signed
      # release tarball (curl) + `jit upgrade`, both quarantine-free, so users
      # run cleanly without a notarization ticket; there is no Homebrew cask
      # (see the removed homebrew_casks block below). Re-add a `notarize:` block
      # (with the MACOS_NOTARY_* env in release.yml, still wired) once Apple's
      # notary is dependable again.

archives:
  - id: jit-archive
    formats: [tar.gz]
    # No {{ .Version }} on purpose: stable asset names make
    # `releases/latest/download/jitpass_darwin_<arch>.tar.gz` an evergreen
    # URL, so the README's install command never goes stale. The release tag
    # and `jit --version` still carry the version.
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: jitpass
    name: jit
  # Published as a DRAFT, then undrafted by release.yml only after the
  # artifact it actually produced has been verified against the very
  # requirement `jit upgrade` enforces on the user's machine.
  #
  # The two halves of the signing story are written by different tools: quill
  # (Anchore's reimplementation of Apple code signing, via the notarize.macos
  # path above) PRODUCES the signature, and Apple's own `codesign --verify
  # --strict -R` CONSUMES it in verifyStagedSignature. Nothing compared them.
  # The preflight in release.yml proves a secret was PRESENT; it cannot prove
  # the bytes quill emitted satisfy the requirement, and no test can — the
  # positive half of TestVerifyStagedSignature validates the requirement's
  # form against an arbitrary Apple-signed .app BUNDLE and skips outright on
  # a machine with none, which is the CI case.
  #
  # Draft is what makes the check safe rather than merely informative:
  # /releases/latest EXCLUDES drafts, and `jit upgrade` resolves exactly that
  # URL. So a release that fails verification is never the one any installed
  # copy can see, and the fix is to delete a draft rather than to race a bad
  # binary that is already live.
  #
  # Note the interaction with keep-existing below: this governs releases this
  # workflow CREATES. Re-running against a tag whose release is already
  # published leaves it published — the gate protects first publication, not
  # a release someone already undrafted by hand.
  draft: true
  # keep-existing: when a release for the tag already exists (e.g. re-running
  # the workflow to backfill assets onto a hand-written release), keep its
  # name and notes and just upload the artifacts.
  mode: keep-existing
  # A re-run must be idempotent. The asset names carry no version (deliberate —
  # /releases/latest/download/ has to stay an evergreen URL), so a second run
  # onto a release that already holds them would otherwise fail mid-upload and
  # could leave a checksums.txt that does not match the published tarball. Every
  # `jit upgrade` then dies on the hash comparison, because those are two
  # independent fetches of "latest".
  replace_existing_artifacts: true

# No Homebrew cask, on purpose. At this stage distribution leads with the
# signed release tarball (curl) + `jit upgrade`; a cask forces the whole
# quarantine/notarization dance (Homebrew quarantines cask downloads, so an
# un-notarized binary needs an xattr strip -- a poor look for a security tool),
# for little benefit while the user base is small. Re-add a `homebrew_casks`
# block once notarization is reliable and there's demand for `brew install`.
