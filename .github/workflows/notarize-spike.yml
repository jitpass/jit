name: Notarize Spike

# Manual probe of Apple's notary service for this account — NOT a release.
# Runs spike/notarize-e2e against the same secrets release.yml uses, so a
# green run here means the real release path would have notarized too.
#
#   gh workflow run notarize-spike.yml                     # full end-to-end
#   gh workflow run notarize-spike.yml -f mode=history     # just list recent
#                                                          # submissions/verdicts
#
# Exit-code meanings (from run.sh): 0 accepted (Gatekeeper leg passed or
# is untestable here — GitHub runners don't enforce Gatekeeper on exec, so
# that leg is only judged on a real Mac), 1 invalid artifact, 2 stuck
# In Progress (the known account condition), 3 a discriminating environment
# blocked the quarantined notarized copy.
# Re-add .goreleaser.yml's notarize block + the Homebrew cask only after the
# acceptance criteria in spike/notarize-e2e/FINDINGS.md are met.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "submit = full end-to-end; history = no new submission"
        default: submit
        type: choice
        options: [submit, history]
      timeout:
        description: "bounded wait for Apple's verdict"
        default: 15m

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: spike/notarize-e2e/go.mod

      - name: Require signing + notary secrets
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          if [ -z "$P12" ] || [ -z "$KEY" ]; then
            echo "MACOS_SIGN_P12 / MACOS_NOTARY_* secrets are not set — nothing to probe." >&2
            exit 1
          fi

      # Fetch the pinned release asset and check its digest, rather than piping
      # an installer script straight into sh. get.anchore.io/quill is an
      # unpinned, mutable endpoint, and this job then hands the process it
      # installs both the Developer ID .p12 and the notary .p8 — so whoever can
      # change that URL's contents can take the signing key. The version was
      # already pinned; what was not pinned was the code doing the installing.
      - name: Install quill (pinned by digest — same signer the release path embeds)
        env:
          QUILL_VERSION: "0.7.1"
          QUILL_SHA256: "086cfb3fc69a305d55d9aa5131bed7739d706bbd8bab78c18d011e7260111e96"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/quill.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/anchore/quill/releases/download/v${QUILL_VERSION}/quill_${QUILL_VERSION}_darwin_arm64.tar.gz"
          echo "${QUILL_SHA256}  ${archive}" | shasum -a 256 --check -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" quill
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run the probe
        env:
          MODE: ${{ inputs.mode }}
          NOTARY_TIMEOUT: ${{ inputs.timeout }}
          QUILL_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          QUILL_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: zsh spike/notarize-e2e/run.sh
