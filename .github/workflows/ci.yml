name: CI

on:
  push:
    branches: [main]
  pull_request:

# CGO_ENABLED=1 (required by internal/secureenclave, TECH_STACK.md §2.3) needs a
# real macOS toolchain — this can't run on Linux runners.
jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -v ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: staticcheck
        run: staticcheck ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

      - name: Install gosec
        # Pinned: a floating @latest meant gosec releases change CI results under
        # unrelated commits (v2.28.0 landed mid-day and broke three pushes). Bump deliberately.
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: gosec
        # -exclude-generated skips cgo-generated glue (keychainwrap/lineage/secureenclave):
        # gosec flags integer-conversion (G115) in cmd/cgo output we neither wrote nor can annotate.
        run: gosec -exclude-generated ./...

  goreleaser-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: check

      - name: Snapshot build (no publish, no signing)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish,sign
