name: Release

# Tag push (v*) is the normal path. workflow_dispatch exists so a release can
# be (re-)built for an existing tag: `gh workflow run release.yml --ref v0.4.0`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# CGO_ENABLED=1 (required by internal/secureenclave, TECH_STACK.md §2.3) needs a
# real macOS toolchain — this can't run on Linux runners.
jobs:
  # The publish is gated on the full CI pipeline running against THIS tag's
  # commit. Nothing before this ran a single test on the release path: a tag
  # pushed at a commit whose CI was red — or a workflow_dispatch re-run of an
  # old tag — went straight to a Developer-ID-signed, notarized binary and a
  # cask push. jit ships `jit upgrade`, so the blast radius of one bad release
  # is every installed copy.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  goreleaser:
    needs: test
    runs-on: macos-latest
    # Budget: build + sign + notarize wait (15m cap in .goreleaser.yml; healthy
    # verdicts arrive in ~20s per spike/notarize-e2e/FINDINGS.md) + the staged
    # verification steps. A run that actually spends the full notarize wait is
    # Apple regressing, and the job failing at this ceiling is the correct
    # loud outcome.
    timeout-minutes: 40
    steps:
      # Actions are pinned to full commit SHAs, not tags. A tag is mutable and
      # repointable by its owner, so `@v4` in THIS job — the one job in the
      # repo that holds MACOS_SIGN_P12 and the Developer ID private key — is a
      # standing grant of that key to whoever controls the tag. ci.yml already
      # pins its three Go tools to exact patch versions for a weaker reason
      # (reproducible results); the actions themselves floated.
      #
      # The trailing comment is the human-readable version. To bump one,
      # resolve the new tag to its SHA rather than editing the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # The signed build must not restore a build cache written by an
          # unrelated main-branch run. The release is the one build in the repo
          # where "where did these object files come from" has a security
          # answer, and a cache hit makes it unauditable for no real saving on
          # a job that runs a handful of times a month.
          cache: false

      # Never ship unsigned (CLAUDE.md), enforced BEFORE the build rather than
      # on the user's machine after download.
      #
      # goreleaser's signing gate is `enabled: {{ isEnvSet "MACOS_SIGN_P12" }}`,
      # and two facts about it make an absent secret dangerous rather than
      # merely inconvenient: isEnvSet is `ok && s != ""`, so the empty string
      # Actions substitutes for a missing secret reads as unset; and the notary
      # pipe answers a false `enabled` with pipe.Skip, not an error. So a
      # deleted, renamed, emptied or fork-scoped secret does not fail the
      # release — it publishes a tarball holding an unsigned Mach-O, silently,
      # which every `jit upgrade` then refuses (verifyStagedSignature fails
      # closed, deliberately with no override).
      #
      # The config comments used to present that as policy, for a reason that
      # does not hold: forks and PR builds are protected by `--snapshot` and by
      # ci.yml passing --skip=publish,sign,notarize, not by this gate. Nothing
      # needs an unsigned PUBLISH to work.
      - name: Require Developer ID signing and notary secrets
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          PW: ${{ secrets.MACOS_SIGN_PASSWORD }}
          NK: ${{ secrets.MACOS_NOTARY_KEY }}
          NKID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NISS: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$P12" ] || [ -z "$PW" ]; then
            echo "::error::refusing to publish without Developer ID signing secrets — an unsigned release traps every user out of 'jit upgrade' until a signed one replaces it"
            exit 1
          fi
          if [ -z "$NK" ] || [ -z "$NKID" ] || [ -z "$NISS" ]; then
            echo "::error::refusing to publish without notary secrets — quill would fail mid-release anyway (wait: true); fix the MACOS_NOTARY_* secrets instead of shipping un-notarized"
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          # Pin the goreleaser MAJOR, not "latest": a future v3 with breaking
          # changes must not silently break a release we didn't touch.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID signing. The config keys off MACOS_SIGN_P12 being set;
          # the preflight above is what makes an unset value fail the release
          # rather than quietly publish an unsigned binary.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          # Notarization (re-enabled 2026-08-07 behind the spike/notarize-e2e
          # gate; wait: true, 15m cap — see .goreleaser.yml for both stories).
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          # Cask push to jitpass/homebrew-tap; absent secret skips only the
          # cask, per `skip_upload` in the homebrew_casks block.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # The signature the release actually carries, checked by the code that
      # will judge it — not by the code that wrote it.
      #
      # The preflight above proves a signing secret was PRESENT. It cannot
      # prove the result satisfies `codesign --verify --strict -R`, because
      # quill writes the signature and Apple's codesign is what
      # verifyStagedSignature runs against it on every user's machine. Until
      # now the first machine to ever make that comparison was a user's, after
      # download — and the failure mode is the worst one this repo has: a
      # rejected signature traps every installed copy out of `jit upgrade`,
      # with an error naming the downloaded file rather than the cause.
      #
      # Deliberately the binary from the TARBALL, not from dist/'s build
      # directory: the tarball is the artifact users receive, and it is the
      # one whose bytes could differ. And deliberately `jit doctor` rather than
      # a hand-written codesign line — doctor's binarySignature() builds its
      # requirement with signatureRequirement(), the same function
      # verifyStagedSignature uses, so this check cannot drift from the client
      # it is standing in for. A hand-rolled requirement string here would be
      # a second copy free to disagree with production, which is the whole
      # class of bug being closed.
      #
      # The expected value names upgradeTeamIDs[0] specifically, not "any
      # accepted team": during a certificate migration the list also accepts a
      # successor, and a release accidentally signed with the outgoing identity
      # must fail here rather than pass as "signed, close enough".
      - name: Verify the released binary satisfies jit upgrade's own requirement
        run: |
          set -euo pipefail
          archive=$(find dist -type f -name 'jitpass_darwin_arm64.tar.gz' | head -1)
          if [ -z "$archive" ]; then
            echo "::error::no release tarball found under dist/"
            exit 1
          fi
          workdir=$(mktemp -d)
          tar -xzf "$archive" -C "$workdir"
          bin="$workdir/jit"
          if [ ! -x "$bin" ]; then
            echo "::error::the release tarball contains no executable jit"
            exit 1
          fi
          # doctor exits non-zero when it finds unrelated problems (no vault
          # and no profiles on a fresh runner), so its verdict is not the
          # signal — the tool.signature field is. Capture, then assert.
          report=$("$bin" doctor --format json 2>/dev/null || true)
          got=$(printf '%s' "$report" | jq -r '.tool.signature // ""')
          want="signed CZC6BH93GJ"
          if [ "$got" != "$want" ]; then
            echo "::error::the published binary reports signature '$got', want '$want' — jit upgrade would refuse this release on every installed copy. The release stays a DRAFT and is not reachable via /releases/latest."
            exit 1
          fi
          echo "verified: $got"

      # Only now does the release become the one `jit upgrade` can see.
      # Anything that failed above leaves a draft: invisible to
      # /releases/latest, and deletable without ever having reached a user.
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false

      # The draft gate has one hole, and the cask is it: goreleaser's
      # cask.Pipe pushes to the tap during the goreleaser step — before the
      # verify step above — and it carries no Release.Draft gate (checked in
      # goreleaser v2 source: publish order is release, then brew/cask "last"
      # because they need the release URL, drafted or not). A verify failure
      # therefore leaves the release correctly frozen as an invisible draft
      # while the tap keeps pointing every `brew install` at
      # /releases/download/<tag>/ assets that 404 for the public,
      # permanently. Undo the cask push, loudly, whenever anything after the
      # goreleaser step fails. Guards: no tap token means no cask was pushed;
      # and the revert only fires when the tap's HEAD is exactly this tag's
      # cask commit (message names the tag, sole file is the cask), so a
      # failure before the cask push reverts nothing of someone else's.
      - name: Roll back the cask on a failed publish
        if: failure()
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "no tap token — no cask was pushed, nothing to roll back"
            exit 0
          fi
          tap=$(mktemp -d)
          git clone --quiet --depth 2 \
            "https://x-access-token:${TAP_TOKEN}@github.com/jitpass/homebrew-tap.git" "$tap"
          cd "$tap"
          subject=$(git log -1 --format=%s)
          files=$(git log -1 --format= --name-only)
          if [ "$files" = "Casks/jitpass.rb" ] && \
             printf '%s' "$subject" | grep -qF "${{ github.ref_name }}"; then
            git -c user.name=jit-release -c user.email=jit-release@users.noreply.github.com \
              revert --no-edit HEAD
            git push --quiet origin HEAD
            echo "::warning::reverted the tap's cask commit ('$subject') — it pointed at this failed release's draft-only assets"
          else
            echo "tap HEAD ('$subject') is not this run's cask commit — nothing to roll back"
          fi
