name: Release

# Tag push (v*) is the normal path. workflow_dispatch exists so a release can
# be (re-)built for an existing tag: `gh workflow run release.yml --ref v0.4.0`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# CGO_ENABLED=1 (required by internal/secureenclave, TECH_STACK.md §2.3) needs a
# real macOS toolchain — this can't run on Linux runners.
jobs:
  # The publish is gated on the full CI pipeline running against THIS tag's
  # commit. Nothing before this ran a single test on the release path: a tag
  # pushed at a commit whose CI was red — or a workflow_dispatch re-run of an
  # old tag — went straight to a Developer-ID-signed, notarized binary and a
  # cask push. jit ships `jit upgrade`, so the blast radius of one bad release
  # is every installed copy.
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  goreleaser:
    needs: test
    runs-on: macos-latest
    # Sized for a signed, NON-notarized build (notarization is intentionally
    # dropped — see .goreleaser.yml). The old value was budgeted for waiting on
    # Apple's verdict and cited a `timeout: 30m` that no longer exists.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Never ship unsigned (CLAUDE.md), enforced BEFORE the build rather than
      # on the user's machine after download.
      #
      # goreleaser's signing gate is `enabled: {{ isEnvSet "MACOS_SIGN_P12" }}`,
      # and two facts about it make an absent secret dangerous rather than
      # merely inconvenient: isEnvSet is `ok && s != ""`, so the empty string
      # Actions substitutes for a missing secret reads as unset; and the notary
      # pipe answers a false `enabled` with pipe.Skip, not an error. So a
      # deleted, renamed, emptied or fork-scoped secret does not fail the
      # release — it publishes a tarball holding an unsigned Mach-O, silently,
      # which every `jit upgrade` then refuses (verifyStagedSignature fails
      # closed, deliberately with no override).
      #
      # The config comments used to present that as policy, for a reason that
      # does not hold: forks and PR builds are protected by `--snapshot` and by
      # ci.yml passing --skip=publish,sign,notarize, not by this gate. Nothing
      # needs an unsigned PUBLISH to work.
      - name: Require Developer ID signing secrets
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          PW: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          if [ -z "$P12" ] || [ -z "$PW" ]; then
            echo "::error::refusing to publish without Developer ID signing secrets — an unsigned release traps every user out of 'jit upgrade' until a signed one replaces it"
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Pin the goreleaser MAJOR, not "latest": a future v3 with breaking
          # changes must not silently break a release we didn't touch.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID signing. The config keys off MACOS_SIGN_P12 being set;
          # the preflight above is what makes an unset value fail the release
          # rather than quietly publish an unsigned binary.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          # Notarization is currently disabled (.goreleaser.yml has no notarize
          # block); these stay wired so re-enabling is a config-only change.
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # The signature the release actually carries, checked by the code that
      # will judge it — not by the code that wrote it.
      #
      # The preflight above proves a signing secret was PRESENT. It cannot
      # prove the result satisfies `codesign --verify --strict -R`, because
      # quill writes the signature and Apple's codesign is what
      # verifyStagedSignature runs against it on every user's machine. Until
      # now the first machine to ever make that comparison was a user's, after
      # download — and the failure mode is the worst one this repo has: a
      # rejected signature traps every installed copy out of `jit upgrade`,
      # with an error naming the downloaded file rather than the cause.
      #
      # Deliberately the binary from the TARBALL, not from dist/'s build
      # directory: the tarball is the artifact users receive, and it is the
      # one whose bytes could differ. And deliberately `jit doctor` rather than
      # a hand-written codesign line — doctor's binarySignature() calls
      # signatureRequirement(upgradeTeamID), the same function
      # verifyStagedSignature uses, so this check cannot drift from the client
      # it is standing in for. A hand-rolled requirement string here would be
      # a second copy free to disagree with production, which is the whole
      # class of bug being closed.
      - name: Verify the released binary satisfies jit upgrade's own requirement
        run: |
          set -euo pipefail
          archive=$(find dist -type f -name 'jitpass_darwin_arm64.tar.gz' | head -1)
          if [ -z "$archive" ]; then
            echo "::error::no release tarball found under dist/"
            exit 1
          fi
          workdir=$(mktemp -d)
          tar -xzf "$archive" -C "$workdir"
          bin="$workdir/jit"
          if [ ! -x "$bin" ]; then
            echo "::error::the release tarball contains no executable jit"
            exit 1
          fi
          # doctor exits non-zero when it finds unrelated problems (no vault
          # and no profiles on a fresh runner), so its verdict is not the
          # signal — the tool.signature field is. Capture, then assert.
          report=$("$bin" doctor --format json 2>/dev/null || true)
          got=$(printf '%s' "$report" | jq -r '.tool.signature // ""')
          want="signed CZC6BH93GJ"
          if [ "$got" != "$want" ]; then
            echo "::error::the published binary reports signature '$got', want '$want' — jit upgrade would refuse this release on every installed copy. The release stays a DRAFT and is not reachable via /releases/latest."
            exit 1
          fi
          echo "verified: $got"

      # Only now does the release become the one `jit upgrade` can see.
      # Anything that failed above leaves a draft: invisible to
      # /releases/latest, and deletable without ever having reached a user.
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
